        - --check
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
    init: true
    networks:
      - mcp-atlas-brave-search-egress

  mcp-atlas-github:
    image: "ghcr.io/scaleapi/mcp-atlas:1.2.7@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c"
    entrypoint:
