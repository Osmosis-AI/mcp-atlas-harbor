  mcp-atlas-public-socket:
  mcp-atlas-brave-search-socket:
  mcp-atlas-github-socket:
  mcp-atlas-twelvedata-socket:
  mcp-atlas-weather-data-socket:

networks:
  mcp-front:
  mcp-atlas-public-egress:
  mcp-atlas-brave-search-egress:
  mcp-atlas-github-egress:
  mcp-atlas-twelvedata-egress:
  mcp-atlas-weather-data-egress:
