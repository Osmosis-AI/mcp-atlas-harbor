services:
  main:
    depends_on:
      mcp-atlas-gateway:
        condition: service_healthy
    networks:
      - mcp-front

  mcp-atlas-gateway:
    image: "ghcr.io/scaleapi/mcp-atlas:1.2.7@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c"
    entrypoint:
      - /agent-environment/.venv/bin/python
      - /harbor/harbor_mcp_bridge.py
    environment:
      MCP_ATLAS_BASE_URL: http://mcp-atlas-runtime:1984
      MCP_ATLAS_ENABLED_TOOLS_FILE: /harbor/enabled_tools.json
      MCP_ATLAS_STARTUP_TIMEOUT_SEC: "240"
      MCP_ATLAS_TIMEOUT_SEC: "180"
      MCP_BRIDGE_HOST: 0.0.0.0
      MCP_BRIDGE_PORT: "18765"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./harbor_mcp_bridge.py:/harbor/harbor_mcp_bridge.py:ro,z
      - ./enabled_tools.json:/harbor/enabled_tools.json:ro,z
    depends_on:
      mcp-atlas-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /agent-environment/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:18765/healthz',timeout=55).read()
      # /healthz re-probes the Atlas backend and re-lists its tools on every
      # call; listing spawns every enabled server and takes several seconds, so
      # poll modestly with a generous timeout once the bridge is up. Failures
      # inside start_period (the bridge's own startup timeout) do not count.
      interval: 30s
      timeout: 60s
      retries: 4
      start_period: 240s
    init: true
    networks:
      - mcp-front
      - mcp-backend

  mcp-atlas-runtime:
    image: "ghcr.io/scaleapi/mcp-atlas:1.2.7@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c"
    # warmup.py installs the enabled servers, then execs the image entrypoint
    # with the image's original command (compose clears CMD when entrypoint is
    # overridden).
    entrypoint:
      - /agent-environment/.venv/bin/python
      - /harbor/warmup.py
    command:
      - uv
      - run
      - python
      - -m
      - uvicorn
      - agent_environment.main:app
      - --host
      - 0.0.0.0
      - --port
      - "1984"
    environment:
      ENABLED_SERVERS: "exa,filesystem,google-workspace,mcp-code-executor"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN:-}"
    volumes:
      # Freeze uvx dependency resolution to the image build date; see uv.toml.
      - ./uv.toml:/etc/uv/uv.toml:ro,z
      - ./warmup.py:/harbor/warmup.py:ro,z
    healthcheck:
      test:
        - CMD
        - /agent-environment/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:1984/health',timeout=20).read()
      # Liveness only: the runtime's own /health status reports a timeout
      # whenever reconnecting all servers takes over five seconds, which is
      # normal for multi-server tasks. Readiness (every allowlisted tool
      # present) is enforced by the gateway. warmup.py installs the servers
      # before uvicorn starts, which can take several minutes on a cold sandbox.
      interval: 10s
      timeout: 30s
      retries: 36
      start_period: 60s
    init: true
    networks:
      - mcp-backend

networks:
  mcp-front:
  mcp-backend:
