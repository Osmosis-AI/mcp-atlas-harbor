schema_version = "1.3"

artifacts = ["/logs/agent"]

[task]
name = "scale-ai/mcp-atlas__689e0b1d9c8e2ac413c1f202"
description = "MCP-Atlas real-server tool-use task"
authors = [{ name = "Scale AI" }]
keywords = ["mcp-atlas", "mcp", "tool-use"]

[metadata]
difficulty = "hard"
category = "tool-use"
source = "ScaleAI/MCP-Atlas"
source_task_id = "689e0b1d9c8e2ac413c1f202"
source_revision = "8c563b55d7c967755f474299848049834d624617"
source_repository = "https://github.com/scaleapi/mcp-atlas"
source_repository_commit = "f24ba3fb0bfa484c86acb28431fad6d7282455f9"
enabled_tool_count = 15
source_enabled_tool_count = 15
unavailable_tool_count = 0
unavailable_tools = []
servers = ["filesystem","git","whois"]
required_env_vars = []
requires_credentials = false
credential_free = true
supported_environment_types = ["docker"]

[agent]
network_mode = "public"
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "public"
build_timeout_sec = 600.0
docker_image = "python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254"
cpus = 1
memory_mb = 2048
storage_mb = 4096
gpus = 0
mcp_servers = []

[verifier.env]
EVAL_LLM_API_KEY = "${EVAL_LLM_API_KEY:-}"
EVAL_LLM_BASE_URL = "${EVAL_LLM_BASE_URL:-}"
EVAL_LLM_MODEL = "${EVAL_LLM_MODEL:-gemini/gemini-3.1-pro-preview}"
EVAL_LLM_CONCURRENCY = "${EVAL_LLM_CONCURRENCY:-30}"
EVAL_LLM_MAX_ATTEMPTS = "${EVAL_LLM_MAX_ATTEMPTS:-3}"
EVAL_LLM_RETRY_BASE_SEC = "${EVAL_LLM_RETRY_BASE_SEC:-1.0}"
EVAL_LLM_TIMEOUT_SEC = "${EVAL_LLM_TIMEOUT_SEC:-60.0}"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
docker_image = "python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254"
cpus = 2
memory_mb = 10240
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "mcp-atlas"
transport = "streamable-http"
url = "http://mcp-atlas-gateway:18765/mcp"

[environment.healthcheck]
command = "python3 -c \"import socket; socket.create_connection(('mcp-atlas-gateway', 18765), timeout=5).close()\""
interval_sec = 5
timeout_sec = 10
start_period_sec = 180
start_interval_sec = 5
retries = 12
