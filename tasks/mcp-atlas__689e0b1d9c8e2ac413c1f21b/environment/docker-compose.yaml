services:
  main:
    depends_on:
      mcp-atlas-gateway:
        condition: service_healthy
    networks:
      - mcp-front

  mcp-atlas-gateway:
    image: "ghcr.io/scaleapi/mcp-atlas:1.2.7@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c"
    entrypoint:
      - /agent-environment/.venv/bin/python
      - /harbor/harbor_mcp_bridge.py
    environment:
      MCP_ATLAS_BASE_URL: http://mcp-atlas-runtime:1984
      MCP_ATLAS_ENABLED_TOOLS_FILE: /harbor/enabled_tools.json
      MCP_ATLAS_STARTUP_TIMEOUT_SEC: "240"
      MCP_ATLAS_TIMEOUT_SEC: "180"
      MCP_BRIDGE_HOST: 0.0.0.0
      MCP_BRIDGE_PORT: "18765"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./harbor_mcp_bridge.py:/harbor/harbor_mcp_bridge.py:ro,z
      - ./enabled_tools.json:/harbor/enabled_tools.json:ro,z
    depends_on:
      mcp-atlas-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /agent-environment/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:18765/healthz',timeout=5).read()
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 10s
    init: true
    networks:
      - mcp-front
      - mcp-backend

  mcp-atlas-runtime:
    image: "ghcr.io/scaleapi/mcp-atlas:1.2.7@sha256:24e6ed3534916afe2c6825382da159a30e23516ef612be5d074fd96a74f9184c"
    environment:
      ENABLED_SERVERS: "filesystem,git,github,lara-translate,whois"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      LARA_ACCESS_KEY_ID: "${LARA_ACCESS_KEY_ID:-}"
      LARA_ACCESS_KEY_SECRET: "${LARA_ACCESS_KEY_SECRET:-}"
    healthcheck:
      test:
        - CMD
        - /agent-environment/.venv/bin/python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://localhost:1984/health',timeout=5));
          raise SystemExit(0 if data.get('status') == 'health_and_client_connection_ok' else 1)
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
    init: true
    networks:
      - mcp-backend

networks:
  mcp-front:
  mcp-backend:
